; Clever Cloud PHP Configuration
; This file configures PHP settings for your application on Clever Cloud

; PHP Version - Use a compatible version (7.4, 8.0, 8.1, 8.2, 8.3)
php = 8.2

; Enable display errors for debugging (set to 0 in production)
display_errors = On
error_reporting = E_ALL

; Memory limit
memory_limit = 256M

; Upload max filesize
upload_max_filesize = 20M

; Post max size
post_max_size = 25M

; Max execution time
max_execution_time = 120

; Max input time
max_input_time = 120

; Session settings
session.save_path = "/tmp"
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly =
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.sid_length = 26
session.trans_sid_tags = "a=href,area=href,frame=src,form="
session.sid_bits_per_character = 5

; Required extensions for MySQL
; These extensions must be enabled on Clever Cloud
extension = mysqli
extension = pdo
extension = pdo_mysql

; Additional recommended extensions
extension = mbstring
extension = json
extension = curl
extension = gd
extension = zip

; Date timezone
date.timezone = Africa/Nairobi
